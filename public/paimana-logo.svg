<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Circular Insignia -->
  <g transform="translate(10, 5)" filter="url(#glow)">
    <!-- Outer measurement scale circular ring -->
    <circle cx="35" cy="35" r="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Tricolor Arc Ribbons -->
    <!-- Saffron Upper Arc -->
    <path d="M 10,35 A 25 25 0 0 1 60,35" fill="none" stroke="url(#saffronGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Green Lower Arc -->
    <path d="M 60,35 A 25 25 0 0 1 10,35" fill="none" stroke="url(#greenGrad)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Ashoka Chakra Spokes in Center -->
    <circle cx="35" cy="35" r="14" fill="#f8fafc" stroke="#000088" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="3" fill="#000088"/>
    <!-- 24 Spokes -->
    <g stroke="#000088" stroke-width="0.75" opacity="0.85">
      <line x1="35" y1="21" x2="35" y2="49"/>
      <line x1="21" y1="35" x2="49" y2="35"/>
      <line x1="25.1" y1="25.1" x2="44.9" y2="44.9"/>
      <line x1="25.1" y1="44.9" x2="44.9" y2="25.1"/>
      <line x1="22" y1="30" x2="48" y2="40"/>
      <line x1="22" y1="40" x2="48" y2="30"/>
      <line x1="30" y1="22" x2="40" y2="48"/>
      <line x1="40" y1="22" x2="30" y2="48"/>
    </g>

    <!-- Caliper / Draftsman Measurement Compass Overlay -->
    <path d="M 35,8 L 22,46 L 26,48 L 35,16 L 44,48 L 48,46 Z" fill="url(#saffronGrad)" opacity="0.95"/>
    <circle cx="35" cy="14" r="3.5" fill="#ffffff" stroke="#e65100" stroke-width="1.5"/>

    <!-- Analytics Rising Graph Line inside -->
    <path d="M 23,38 L 30,32 L 36,35 L 46,24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="24" r="2" fill="#2563eb"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(88, 12)">
    <!-- Main Acronym Title: PAIMANA -->
    <text x="0" y="34" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#0a2540">
      PAIMANA
    </text>

    <!-- AI Tag Badge -->
    <rect x="175" y="10" width="38" height="22" rx="4" fill="#ea580c"/>
    <text x="194" y="26" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      AI
    </text>

    <!-- Devanagari Script -->
    <text x="0" y="49" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="11" font-weight="bold" fill="#ea580c" letter-spacing="1">
      पैमाना • परियोजना मूल्यांकन एवं निगरानी
    </text>

    <!-- Full Form Subtext -->
    <text x="0" y="63" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#475569" letter-spacing="0.3">
      PROJECT ASSESSMENT, INFRASTRUCTURE MONITORING &amp; ANALYTICS
    </text>
  </g>
</svg>
